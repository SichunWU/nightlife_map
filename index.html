<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>深圳夜生活地图</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />

  <style>
    @font-face {
      font-family: "ZhengQingKeLengKuTi";
      src: url("fonts/ZhengQingKeLengKuTi-2.ttf") format("truetype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    :root {
      --cyan: #00e5ff;
      --pink: #ff4fd8;
      --bg: #0a0e17;
      --border: rgba(0, 229, 255, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    #map { width: 100vw; height: 100vh; }

    /* ============ 标题 ============ */

    .title {
      position: absolute;
      top: 24px; left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      color: #ffffff;
      font: 400 36px/1.2 "ZhengQingKeLengKuTi", sans-serif;
      letter-spacing: 12px;
      text-shadow:
        0 0 10px rgba(0, 212, 255, 0.9),
        0 0 24px rgba(0, 212, 255, 0.5),
        0 0 48px rgba(0, 212, 255, 0.3);
      pointer-events: none;
      user-select: none;
      white-space: nowrap;
    }

    /* ============ 侧边面板 ============ */

    .side-panel {
      position: absolute;
      left: 18px; top: 82px;
      z-index: 30;
      width: 260px;
      max-height: calc(100% - 104px);
      display: flex;
      flex-direction: column;
      background: rgba(7, 12, 20, 0.80);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow:
        0 0 16px rgba(0, 229, 255, 0.10),
        inset 0 0 25px rgba(0, 229, 255, 0.025);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      overflow: hidden;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    /* ============ 分类 ============ */

    .type-list { flex: 0 0 auto; padding: 6px; }

    .type-button {
      position: relative;
      width: 100%;
      display: flex; align-items: center;
      min-height: 30px;
      padding: 5px 8px; margin-bottom: 2px;
      border: 0; border-radius: 7px;
      background: transparent;
      color: #aab9c9;
      font: 500 12px/1.4 "Noto Sans SC", sans-serif;
      cursor: pointer; text-align: left;
      transition: background 0.18s ease, color 0.18s ease;
    }

    .type-button:last-child { margin-bottom: 0; }
    .type-button:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .type-button.active { background: rgba(0,229,255,0.10); color: #fff; }

    .type-dot {
      flex: 0 0 auto;
      width: 9px; height: 9px;
      margin-right: 9px;
      border-radius: 50%;
      box-shadow: 0 0 5px currentColor, 0 0 11px currentColor;
    }

    .type-name { flex: 1; }

    .type-count {
      flex: 0 0 auto;
      min-width: 24px;
      padding: 2px 6px;
      border-radius: 10px;
      background: rgba(255,255,255,0.07);
      color: #7f91a5;
      font-size: 10px;
      text-align: center;
    }

    .type-button.active .type-count {
      color: #ffffff;
      background: rgba(0,229,255,0.13);
    }

    /* ============ 搜索行 ============ */

    .search-row {
      flex: 0 0 auto;
      display: flex; align-items: center;
      gap: 8px;
      padding: 8px 9px;
      border-top: 1px solid rgba(255,255,255,0.08);
    }

    .search-toggle {
      flex: 0 0 auto;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
      border-radius: 50%;
      border: 1px solid rgba(0,229,255,0.28);
      background: rgba(0,229,255,0.06);
      color: #7fd9ff;
      cursor: pointer;
      transition: background 0.18s ease, color 0.18s ease,
                  border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .search-toggle:hover {
      background: rgba(0,229,255,0.16);
      color: #ffffff;
      border-color: rgba(0,229,255,0.55);
    }

    .search-toggle.active {
      background: rgba(0,229,255,0.20);
      color: #ffffff;
      border-color: rgba(0,229,255,0.70);
      box-shadow: 0 0 12px rgba(0,229,255,0.35);
    }

    .search-toggle svg { display: block; }

    .search-box { flex: 1; display: none; min-width: 0; }
    .search-box.open { display: block; animation: fadeIn 0.18s ease; }

    .search-box input {
      width: 100%; height: 34px;
      padding: 0 12px;
      border: 1px solid rgba(0,229,255,0.25);
      border-radius: 17px;
      background: rgba(255,255,255,0.05);
      color: #ffffff;
      font: 400 12px/1.4 "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .search-box input::placeholder { color: #5f7286; }

    .search-box input:focus {
      border-color: rgba(0,229,255,0.6);
      box-shadow: 0 0 10px rgba(0,229,255,0.18);
    }

    /* 数字角标：右边缘与分类数字对齐 */
    .search-count {
      flex: 0 0 auto;
      margin-left: auto;
      margin-right: 8px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ============ 地点列表 ============ */

    .spot-list {
      display: none;
      flex: 1; min-height: 0;
      max-height: 44vh;
      padding: 8px 7px;
      overflow-y: auto;
      border-top: 1px solid rgba(255,255,255,0.08);
      scrollbar-width: thin;
      scrollbar-color: rgba(0,229,255,0.3) transparent;
    }

    .spot-list.open { display: block; animation: fadeIn 0.18s ease; }

    .spot-list::-webkit-scrollbar { width: 4px; }
    .spot-list::-webkit-scrollbar-track { background: transparent; }
    .spot-list::-webkit-scrollbar-thumb {
      background: rgba(0,229,255,0.28);
      border-radius: 4px;
    }

    .spot-item {
      width: 100%;
      display: flex; align-items: center;
      padding: 8px 7px; margin-bottom: 3px;
      border: 0; border-radius: 7px;
      background: transparent;
      color: #d4dce5;
      font: 400 12px/1.4 "Noto Sans SC", sans-serif;
      text-align: left;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.18s ease;
    }

    .spot-item:hover {
      background: rgba(255,255,255,0.065);
      transform: translateX(2px);
    }

    .spot-item.active { background: rgba(0,229,255,0.10); }

    .spot-item-dot {
      flex: 0 0 auto;
      width: 5px; height: 5px;
      margin-right: 9px;
      border-radius: 50%;
    }

    .spot-item-info { min-width: 0; flex: 1; }

    .spot-item-name {
      display: block;
      overflow: hidden;
      color: #ffffff;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .spot-item-meta {
      display: flex; align-items: center;
      gap: 7px;
      margin-top: 2px;
      color: #718399;
      font-size: 10px;
      line-height: 1.4;
    }

    .spot-item-meta > span { white-space: nowrap; }

    .spot-item-address {
      display: block;
      margin-top: 2px;
      overflow: hidden;
      color: #5f7286;
      font-size: 10px;
      line-height: 1.4;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .empty-list {
      padding: 18px 10px;
      color: #627386;
      font-size: 11px;
      text-align: center;
    }

    /* ============ 悬停提示 ============ */

    .map-tooltip {
      position: absolute;
      z-index: 40;
      display: none;
      padding: 6px 10px;
      max-width: 220px;
      border-radius: 8px;
      border: 1px solid rgba(0,229,255,0.55);
      background: rgba(10,14,23,0.94);
      box-shadow:
        0 0 12px rgba(0,229,255,0.35),
        0 0 24px rgba(0,0,0,0.6);
      color: #ffffff;
      font: 500 12px/1.4 "Noto Sans SC", "PingFang SC", sans-serif;
      white-space: nowrap;
      pointer-events: none;
      transform: translate(-50%, -100%);
      transition: opacity 0.12s ease;
    }

    .map-tooltip.visible { display: block; }

    .map-tooltip .tt-name {
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .map-tooltip .tt-meta {
      margin-top: 2px;
      font-size: 11px;
      color: #8aa0b8;
    }

    /* ============ Popup ============ */

    .maplibregl-popup { z-index: 50; }

    .maplibregl-popup-content {
      position: relative;
      width: 300px;
      max-width: calc(100vw - 20px);
      padding: 0;
      overflow: hidden;
      background: rgba(10,14,23,0.97);
      border: 1px solid var(--cyan);
      border-radius: 9px;
      box-shadow:
        0 0 12px rgba(0,229,255,0.55),
        0 0 28px rgba(0,229,255,0.18),
        0 0 24px rgba(255,255,255,0.12);
      color: #fff;
      font: 14px/1.6 "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .maplibregl-popup-tip { border-top-color: var(--cyan) !important; }

    .maplibregl-popup-close-button {
      position: absolute;
      top: 7px; right: 7px;
      z-index: 20;
      width: 27px; height: 27px;
      padding: 0;
      border: 0; border-radius: 50%;
      background: rgba(10,14,23,0.80);
      color: #ffffff;
      font: 500 19px/25px "Noto Sans SC", sans-serif;
      text-align: center;
      cursor: pointer;
    }

    .maplibregl-popup-close-button:hover { background: rgba(0,229,255,0.25); }

    /* ============ Popup Gallery ============ */

    .popup-gallery {
      position: relative;
      width: 100%; height: 169px;
      overflow: hidden;
      background: #0b1220;
      cursor: zoom-in;
    }

    .popup-gallery img {
      display: block;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.35s ease;
    }

    .popup-gallery img.loaded { opacity: 1; }
    .popup-gallery:hover img.loaded { transform: scale(1.025); }

    .gallery-loader {
      position: absolute;
      left: 50%; top: 50%;
      width: 28px; height: 28px;
      margin-left: -14px; margin-top: -14px;
      border: 2px solid rgba(255,255,255,0.18);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      pointer-events: none;
    }

    .gallery-loader.hidden { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .gallery-btn {
      position: absolute;
      top: 50%; z-index: 5;
      width: 35px; height: 47px;
      margin-top: -23.5px;
      display: flex; align-items: center; justify-content: center;
      padding: 0;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 7px;
      background: rgba(4,9,17,0.60);
      color: #ffffff;
      font: 400 25px/1 Arial, sans-serif;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s ease, background 0.2s ease;
    }

    .popup-gallery:hover .gallery-btn { opacity: 1; }
    .gallery-btn:hover { background: rgba(0,229,255,0.25); }
    .gallery-prev { left: 8px; }
    .gallery-next { right: 8px; }
    .gallery-btn.hidden { display: none; }

    .gallery-counter {
      position: absolute;
      right: 9px; bottom: 9px; z-index: 6;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(4,9,17,0.72);
      color: #ffffff;
      font-size: 11px;
      pointer-events: none;
    }

    /* ============ Popup Details ============ */

    .popup-details { padding: 11px 14px 14px; }

    .popup-name {
      padding-right: 25px;
      color: #ffffff;
      font-size: 16px; font-weight: 700;
      line-height: 1.45;
      white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 0 8px var(--spot-color);
    }

    .popup-meta {
      margin-top: 3px;
      color: var(--spot-color);
      font-size: 12px;
    }

    .popup-desc {
      margin-top: 8px;
      color: #ffffff;
      font-size: 13px; line-height: 1.6;
    }

    .popup-row {
      display: flex; gap: 7px;
      align-items: flex-start;
      margin-top: 8px;
      color: #b9c7d6;
      font-size: 12px; line-height: 1.5;
    }

    .popup-row svg { flex: 0 0 auto; margin-top: 2px; }

    /* ============ Lightbox ============ */

    .lightbox {
      position: fixed;
      inset: 0; z-index: 99999;
      display: none;
      align-items: center; justify-content: center;
      padding: 30px;
      background: rgba(0,0,0,0.88);
      backdrop-filter: blur(7px);
      -webkit-backdrop-filter: blur(7px);
      touch-action: none;
    }

    .lightbox.open { display: flex; }

    .lightbox-image-wrap {
      position: relative;
      width: min(1100px, 94vw);
      height: min(82vh, 800px);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    .lightbox-image {
      display: block;
      max-width: 100%; max-height: 100%;
      object-fit: contain;
      border-radius: 5px;
      box-shadow:
        0 0 35px rgba(0,229,255,0.18),
        0 0 80px rgba(0,0,0,0.8);
      opacity: 0;
      transition: opacity 0.22s ease, transform 0.28s ease;
      cursor: zoom-in;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .lightbox-image.loaded { opacity: 1; }
    .lightbox-image.zoomed { transform: scale(2.4); cursor: zoom-out; }

    .lightbox-loader {
      position: absolute;
      left: 50%; top: 50%;
      width: 38px; height: 38px;
      margin-left: -19px; margin-top: -19px;
      border: 2px solid rgba(255,255,255,0.18);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .lightbox-loader.hidden { display: none; }

    .lightbox-close {
      position: absolute;
      top: 18px; right: 22px; z-index: 10;
      width: 46px; height: 46px;
      padding: 0;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50%;
      background: rgba(10,14,23,0.72);
      color: #ffffff;
      font: 300 30px/42px Arial, sans-serif;
      cursor: pointer;
    }

    .lightbox-btn {
      position: absolute;
      top: 50%; z-index: 10;
      width: 52px; height: 72px;
      margin-top: -36px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 9px;
      background: rgba(10,14,23,0.64);
      color: #ffffff;
      font: 300 38px/1 Arial, sans-serif;
      cursor: pointer;
    }

    .lightbox-btn:hover,
    .lightbox-close:hover { background: rgba(0,229,255,0.22); }

    .lightbox-prev { left: 22px; }
    .lightbox-next { right: 22px; }
    .lightbox-btn.hidden { display: none; }

    .lightbox-counter {
      position: absolute;
      left: 50%; bottom: 17px;
      transform: translateX(-50%);
      z-index: 10;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(10,14,23,0.72);
      color: #ffffff;
      font-size: 12px;
      pointer-events: none;
    }

    .lightbox-name {
      position: absolute;
      left: 50%; top: 20px;
      transform: translateX(-50%);
      z-index: 10;
      max-width: 55vw;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(10,14,23,0.62);
      color: #ffffff;
      font-size: 12px;
      white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    /* ============ 桌面端隐藏 mobile-toggle & panel-close-btn ============ */

    .mobile-toggle,
    .panel-close-btn { display: none; }

    /* ============ 手机端 ============ */

    @media (max-width: 700px) {
      .spot-item-address {
        font-size: 9px;
        margin-top: 1px;
      }
      .title {
        top: 15px;
        font-size: 27px;
        letter-spacing: 7px;
      }

      /* list 按钮：固定在屏幕左上角
         - top: 70px  → 与面板内关闭按钮同一水平线
         - left: 16px → 与搜索图标同一左边距 */
      .mobile-toggle {
        display: flex;
        align-items: center; justify-content: center;
        position: fixed;
        top: 70px;
        left: 16px;
        z-index: 45;
        width: 32px; height: 32px;
        padding: 0;
        border: 1px solid rgba(0,229,255,0.45);
        border-radius: 50%;
        background: rgba(7,12,20,0.9);
        color: #7fd9ff;
        cursor: pointer;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow:
          0 0 12px rgba(0,229,255,0.22),
          inset 0 0 8px rgba(0,229,255,0.08);
        transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
      }

      .mobile-toggle:active { transform: scale(0.92); }

      /* 面板展开时，浮动按钮隐藏（由面板内关闭按钮接管同位置） */
      /*.mobile-toggle.open { display: none; }*/
      .mobile-toggle.open {
        background: rgba(7, 12, 20, 0.95);
        border-color: rgba(0, 229, 255, 0.85);
        color: #ffffff;
      }

      /* 面板：默认隐藏，展开才从左侧滑入 */
      .side-panel {
        display: none;
        position: absolute;
        left: 8px;
        top: 62px;
        width: 230px;
        max-height: calc(100% - 74px);
        padding-top: 48px; /* 面板顶部留空间给关闭按钮 */
        z-index: 35;
      }

      .side-panel.mobile-open {
        display: flex;
        animation: mobilePanelIn 0.22s ease;
      }

      @keyframes mobilePanelIn {
        from { opacity: 0; transform: translateX(-12px); }
        to   { opacity: 1; transform: translateX(0); }
      }

      /* 面板内关闭按钮：与浮动按钮同位（视觉上原地切换） */
      .panel-close-btn {
        display: none;
        position: absolute;
        top: 8px; right: 8px; z-index: 40;
        width: 28px; height: 28px;
        padding: 0;
        align-items: center; justify-content: center;
        border: 1px solid rgba(0,229,255,0.35);
        border-radius: 50%;
        background: rgba(0,229,255,0.12);
        color: #7fd9ff;
        cursor: pointer;
        transition: background 0.18s ease, color 0.18s ease;
      }

      .panel-close-btn:active {
        background: rgba(0,229,255,0.30);
        color: #ffffff;
      }

      .side-panel.mobile-open .panel-close-btn { display: flex; }

      /* 分类紧凑 */
      .type-list { padding: 4px 6px 6px; }

      .type-button {
        min-height: 28px;
        padding: 4px 8px;
        margin-bottom: 2px;
        font-size: 11px;
      }

      .type-dot { width: 7px; height: 7px; margin-right: 7px; }
      .type-count { min-width: 20px; padding: 1px 5px; font-size: 10px; }

      /* 搜索行数字对齐 */
      .search-count { margin-right: 6px; }

      /* 列表最大高度 */
      .spot-list { max-height: 30vh; }

      /* 搜索行紧凑 */
      .search-row { padding: 6px 8px; gap: 6px; }
      .search-toggle { width: 32px; height: 32px; }
      .search-box input { height: 32px; }

      .spot-item { padding: 7px 6px; font-size: 11px; }

      .maplibregl-popup-content { width: min(300px, calc(100vw - 20px)); }
      .popup-gallery { height: min(169px, 45vw); }

      .gallery-btn {
        width: 40px; height: 50px;
        margin-top: -25px;
        opacity: 1;
      }

      .lightbox { padding: 12px; }
      .lightbox-image-wrap { width: 100vw; height: 78vh; }

      .lightbox-btn {
        width: 43px; height: 58px;
        margin-top: -29px;
        font-size: 31px;
      }

      .lightbox-prev { left: 7px; }
      .lightbox-next { right: 7px; }

      .lightbox-close {
        top: 12px; right: 12px;
        width: 42px; height: 42px;
        font-size: 27px; line-height: 38px;
      }

      .lightbox-name { top: 14px; max-width: 50vw; }
    }
  </style>
</head>

<body>

  <div id="map"></div>

  <div class="map-tooltip" id="mapTooltip"></div>

  <!-- list 图标：桌面端隐藏，手机端固定在左上角 -->
  <button
    class="mobile-toggle"
    id="mobileToggle"
    type="button"
    aria-label="分类与列表"
    aria-expanded="false"
  >
    <svg width="16" height="16" viewBox="0 0 24 24"
         fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round">
      <line x1="4" y1="7" x2="20" y2="7"/>
      <line x1="4" y1="12" x2="20" y2="12"/>
      <line x1="4" y1="17" x2="20" y2="17"/>
    </svg>
  </button>

  <div class="title">深圳夜生活</div>

  <aside class="side-panel" id="sidePanel">

    <button class="panel-close-btn" id="panelCloseBtn" type="button" aria-label="关闭">
      <svg width="14" height="14" viewBox="0 0 24 24"
           fill="none" stroke="currentColor"

    /* =========================================================
       GCJ-02 → WGS-84
    ========================================================== */
    const PI = Math.PI;
    const AXIS = 6378245.0;
    const EE = 0.00669342162296594323;

    function transformLat(x, y) {
      let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y;
      ret += 0.2 * Math.sqrt(Math.abs(x));
      ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
      ret += (20.0 * Math.sin(y * PI) + 40.0 * Math.sin((y / 3.0) * PI)) * 2.0 / 3.0;
      ret += (160.0 * Math.sin((y / 12.0) * PI) + 320.0 * Math.sin((y * PI) / 30.0)) * 2.0 / 3.0;
      return ret;
    }

    function transformLng(x, y) {
      let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y;
      ret += 0.1 * Math.sqrt(Math.abs(x));
      ret += (20.0 * Math.sin(6.0 * x * PI) + 20.0 * Math.sin(2.0 * x * PI)) * 2.0 / 3.0;
      ret += (20.0 * Math.sin(x * PI) + 40.0 * Math.sin((x / 3.0) * PI)) * 2.0 / 3.0;
      ret += (150.0 * Math.sin((x / 12.0) * PI) + 300.0 * Math.sin((x / 30.0) * PI)) * 2.0 / 3.0;
      return ret;
    }

    function gcj02ToWgs84(lng, lat) {
      const dLat = transformLat(lng - 105.0, lat - 35.0);
      const dLng = transformLng(lng - 105.0, lat - 35.0);
      const radLat = (lat / 180.0) * PI;
      const magic = 1 - EE * Math.sin(radLat) ** 2;
      const sqrtMagic = Math.sqrt(magic);
      const deltaLat = (dLat * 180.0) / ((AXIS * (1 - EE)) / (magic * sqrtMagic) * PI);
      const deltaLng = (dLng * 180.0) / ((AXIS / sqrtMagic) * Math.cos(radLat) * PI);
      return [lng - deltaLng, lat - deltaLat];
    }

    function convertCoordinates(c) {
      if (typeof c[0] === "number") return gcj02ToWgs84(c[0], c[1]);
      return c.map(convertCoordinates);
    }

    function convertBoundaryToWgs84(geojson) {
      return {
        ...geojson,
        features: geojson.features.map(feature => ({
          ...feature,
          geometry: { ...feature.geometry, coordinates: convertCoordinates(feature.geometry.coordinates) },
          properties: { ...feature.properties,
            center: feature.properties.center &&
              gcj02ToWgs84(feature.properties.center[0], feature.properties.center[1]) }
        }))
      };
    }

    function escapeHtml(v) {
      if (v === null || v === undefined) return "";
      return String(v)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function getSpotImages(spot) {
      const urls = [];
      if (Array.isArray(spot.photos)) {
        spot.photos.forEach(photo => {
          let url = "";
          if (typeof photo === "string") url = photo;
          else if (photo && photo.url) url = photo.url;
          url = localImageUrl(url);
          if (url) urls.push(url);
        });
      }
      if (urls.length === 0 && spot.image) {
        const url = localImageUrl(spot.image);
        if (url) urls.push(url);
      }
      if (urls.length === 0) urls.push(PREVIEW_IMAGE);
      return [...new Set(urls)];
    }

    function safePinyin(text, pattern) {
      if (!text || typeof pinyinPro === "undefined") return "";
      try {
        const arr = pinyinPro.pinyin(text, {
          toneType: "none", type: "array", pattern: pattern || "pinyin"
        });
        return arr.join("").toLowerCase();
      } catch (e) { return ""; }
    }

    function spotMatchesQuery(spot, query) {
      const index = spot._search;
      if (!index) return 0;

      const compact = query.replace(/\s+/g, "");

      // 名称匹配优先级最高
      if (index.nameLower.includes(query)) return 100;
      if (compact && index.nameFull.includes(compact)) return 80;
      if (compact && index.nameInitial.includes(compact)) return 60;

      // 地址匹配次之
      if (index.addressLower.includes(query)) return 40;
      if (compact && index.addressFull.includes(compact)) return 30;
      if (compact && index.addressInitial.includes(compact)) return 20;

      return 0;
    }

    function renderSpotList() {
      const list = document.getElementById("spotList");
      const countEl = document.getElementById("searchCount");
      let spots = nightSpots;
      if (activeType) spots = spots.filter(spot => spot.type === activeType);
      // const query = searchQuery.trim().toLowerCase();
      // if (query) spots = spots.filter(spot => spotMatchesQuery(spot, query));
      // spots = spots.slice().sort((a, b) => Number(b.rating || 0) - Number(a.rating || 0));
      const query = searchQuery.trim().toLowerCase();
      if (query) {
        // 先算分数，再过滤，再排序
        spots = spots
          .map(spot => ({ spot, score: spotMatchesQuery(spot, query) }))
          .filter(item => item.score > 0)
          .sort((a, b) =>
            b.score - a.score ||
            Number(b.spot.rating || 0) - Number(a.spot.rating || 0)
          )
          .map(item => item.spot);
      } else {
        // 没有搜索词时，按评分排序
        spots = spots.slice().sort((a, b) =>
          Number(b.rating || 0) - Number(a.rating || 0)
        );
      }

      if (countEl) countEl.textContent = spots.length;
      list.innerHTML = "";
      if (spots.length === 0) {
        list.innerHTML = `<div class="empty-list">暂无地点</div>`;
        return;
      }
      spots.forEach(spot => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "spot-item";
        item.dataset.name = spot.name;
        const color = SPOT_COLORS[spot.type] || "#ffffff";
        const rating = Number.isFinite(Number(spot.rating)) ? Number(spot.rating).toFixed(1) : "--";
        const typeLabel = SPOT_LABELS[spot.type] || spot.type || "";
        // item.innerHTML = `
        //   <span class="spot-item-dot" style="background:${color};box-shadow:0 0 6px ${color}"></span>

        const address = spot.address || "";
        item.innerHTML = `

          <span class="spot-item-info">
            <span class="spot-item-name">${escapeHtml(spot.name || "")}</span>
            <span class="spot-item-meta">
              ${typeLabel ? `<span>${escapeHtml(typeLabel)}</span>` : ""}
              <span>★ ${rating}</span>
            </span>
            ${address ? `<span class="spot-item-address">${escapeHtml(address)}</span>` : ""}
          </span>
        `;
        item.addEventListener("click", () => focusSpot(spot));
        list.appendChild(item);
      });
    }

    function updateMapFilter(type) {
      if (!map.getLayer("night-halo")) return;
      const filter = type ? ["==", ["get", "type"], type] : null;
      ["night-glow", "night-halo", "night-core"].forEach(layerId => {
        if (map.getLayer(layerId)) map.setFilter(layerId, filter);
      });
    }

    /* =========================================================

    ========================================================== */
    function createPopupGallery(images, name) {
      const multiple = images.length > 1;
      return `
        <div class="popup-gallery" id="popupGallery">
          <div class="gallery-loader" id="popupGalleryLoader"></div>
          <img id="popupGalleryImage" src="${escapeHtml(images[0])}"
               alt="${escapeHtml(name)}" draggable="false" />
          <button class="gallery-btn gallery-prev ${multiple ? "" : "hidden"}"
                  id="popupGalleryPrev" type="button" aria-label="上一张">‹</button>
          <button class="gallery-btn gallery-next ${multiple ? "" : "hidden"}"
                  id="popupGalleryNext" type="button" aria-label="下一张">›</button>
          ${multiple ? `<div class="gallery-counter" id="popupGalleryCounter">1 / ${images.length}</div>` : ""}
        </div>
      `;
    }

    function setupPopupGallery(images, name) {
      let index = 0;
      const gallery = document.getElementById("popupGallery");
      const image = document.getElementById("popupGalleryImage");
      const loader = document.getElementById("popupGalleryLoader");
      const prev = document.getElementById("popupGalleryPrev");
      const next = document.getElementById("popupGalleryNext");
      const counter = document.getElementById("popupGalleryCounter");
      if (!gallery || !image) return;

      function loadImage(targetIndex) {
        index = (targetIndex + images.length) % images.length;
        image.classList.remove("loaded");
        loader.classList.remove("hidden");
        const temp = new Image();
        temp.onload = () => {
          image.src = images[index];
          image.classList.add("loaded");
          loader.classList.add("hidden");
        };
        temp.onerror = () => {
          image.src = PREVIEW_IMAGE;
          image.classList.add("loaded");
          loader.classList.add("hidden");
        };
        temp.src = images[index];
        if (counter) counter.textContent = `${index + 1} / ${images.length}`;
        if (images.length > 1) {
          new Image().src = images[(index + 1) % images.length];
          new Image().src = images[(index - 1 + images.length) % images.length];
        }
      }

      if (prev) prev.addEventListener("click", e => { e.stopPropagation(); loadImage(index - 1); });
      if (next) next.addEventListener("click", e => { e.stopPropagation(); loadImage(index + 1); });

      gallery.addEventListener("click", event => {
        if (event.target.closest(".gallery-btn")) return;
        openLightbox(images, index, name);
      });
      loadImage(0);
    }

    /* =========================================================
       Popup HTML
    ========================================================== */
    function buildPopupHTML(props) {
      const type = props.type || "bar";
      const typeLabel = SPOT_LABELS[type] || type;
      const typeColor = SPOT_COLORS[type] || "#ffffff";
      const ratingValue = Number(props.rating);
      const rating = Number.isFinite(ratingValue) ? ratingValue.toFixed(1) : "--";
      const spend = (props.spend === null || props.spend === undefined || props.spend === "")
        ? "" : `￥${escapeHtml(props.spend)}`;
      const description = props.desc || "";
      const address = props.address || "";
      const hours = props.hours || "";
      let images = [];
      try { if (props.images) images = JSON.parse(props.images); } catch (e) {}
      if (!Array.isArray(images) || images.length === 0) images = [PREVIEW_IMAGE];

      return `
        ${createPopupGallery(images, props.name || "")}
        <div class="popup-details" style="--spot-color:${typeColor}">
          <div class="popup-name">${escapeHtml(props.name || "")}</div>
          <div class="popup-meta">
            ${escapeHtml(typeLabel)} · ★ ${rating}
            ${spend ? ` · ${spend}` : ""}
          </div>
          ${description ? `<div class="popup-desc">${escapeHtml(description)}</div>` : ""}

            <div class="popup-row">

            </div>` : ""}
          ${hours ? `
            <div class="popup-row">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                   stroke="#ffcf5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

              </svg>
              <span>${escapeHtml(hours)}</span>

      `;
    }

    function findFeatureForSpot(spot) {
      if (!spotsGeoJSON) return null;
      return spotsGeoJSON.features.find(f => f.properties.name === spot.name) || null;
    }

    function openSpotPopup(feature) {
      if (!feature) return;
      const props = feature.properties;
      const coords = feature.geometry.coordinates.slice();
      if (currentPopup) { currentPopup.remove(); currentPopup = null; }

      let images = [];
      try { images = props.images ? JSON.parse(props.images) : []; } catch (e) { images = []; }
      if (!Array.isArray(images) || images.length === 0) images = [PREVIEW_IMAGE];

      const popup = new maplibregl.Popup({
        anchor: "bottom",
        offset: [0, -16],
        closeButton: true,
        closeOnClick: true,
        maxWidth: "none"
      }).setLngLat(coords).setHTML(buildPopupHTML(props));

      currentPopup = popup;
      currentSpot = feature;
      popup.addTo(map);
      setupPopupGallery(images, props.name || "");

      document.querySelectorAll(".spot-item").forEach(item => {
        item.classList.toggle("active", item.dataset.name === props.name);
      });

      popup.on("close", () => {
        if (currentPopup === popup) currentPopup = null;
        currentSpot = null;
        document.querySelectorAll(".spot-item").forEach(i => i.classList.remove("active"));
      });
    }

    function focusSpot(spot) {
      const feature = findFeatureForSpot(spot);
      if (!feature) return;
      closeCurrentPopup();
      pendingSpot = feature;
      const offsetY = Math.round(window.innerHeight * 0.16);
      map.flyTo({
        center: feature.geometry.coordinates,
        zoom: 16, pitch: 50,
        bearing: map.getBearing(),
        offset: [0, offsetY],
        duration: 1200, essential: true
      });
      map.once("moveend", () => {
        if (pendingSpot !== feature) return;
        openSpotPopup(feature);
        pendingSpot = null;
      });
    }

    function handleMapSpotClick(event) {
      if (!event.features || !event.features.length) return;
      const feature = event.features[0];
      const spot = {
        name: feature.properties.name,
        type: feature.properties.type,
        rating: feature.properties.rating,
        spend: feature.properties.spend,
        desc: feature.properties.desc,
        address: feature.properties.address,
        hours: feature.properties.hours,
        lng: feature.geometry.coordinates[0],
        lat: feature.geometry.coordinates[1]
      };
      focusSpot(spot);
    }

    /* =========================================================
       Lightbox
    ========================================================== */
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");
    const lightboxLoader = document.getElementById("lightboxLoader");
    const lightboxCounter = document.getElementById("lightboxCounter");
    const lightboxName = document.getElementById("lightboxName");
    const lightboxPrev = document.getElementById("lightboxPrev");
    const lightboxNext = document.getElementById("lightboxNext");
    const lightboxClose = document.getElementById("lightboxClose");

    let lightboxZoomed = false;
    let lastImageTap = 0;

    function resetLightboxZoom() {
      lightboxZoomed = false;
      lightboxImage.classList.remove("zoomed");
    }

    lightboxImage.addEventListener("click", event => {
      event.stopPropagation();
      const now = Date.now();
      if (now - lastImageTap < 320) {
        lightboxZoomed = !lightboxZoomed;
        lightboxImage.classList.toggle("zoomed", lightboxZoomed);
        lastImageTap = 0;
      } else {
        lastImageTap = now;
      }
    });

    function openLightbox(images, index, name) {
      currentGallery = images.slice();
      currentGalleryIndex = Math.max(0, Math.min(index || 0, currentGallery.length - 1));
      currentGalleryName = name || "";
      resetLightboxZoom();
      lightbox.classList.add("open");
      lightbox.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      updateLightbox();
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      lightbox.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      lightboxImage.src = "";
      lightboxImage.classList.remove("loaded");
      resetLightboxZoom();
    }

    function updateLightbox() {
      if (currentGallery.length === 0) return;
      resetLightboxZoom();
      const url = currentGallery[currentGalleryIndex];
      lightboxImage.classList.remove("loaded");
      lightboxLoader.classList.remove("hidden");
      lightboxName.textContent = currentGalleryName;
      lightboxCounter.textContent = `${currentGalleryIndex + 1} / ${currentGallery.length}`;
      if (currentGallery.length <= 1) {
        lightboxPrev.classList.add("hidden");
        lightboxNext.classList.add("hidden");
      } else {
        lightboxPrev.classList.remove("hidden");
        lightboxNext.classList.remove("hidden");
      }
      if (currentGallery.length > 1) {
        new Image().src = currentGallery[(currentGalleryIndex + 1) % currentGallery.length];
        new Image().src = currentGallery[(currentGalleryIndex - 1 + currentGallery.length) % currentGallery.length];
      }
      lightboxImage.onload = () => {
        lightboxLoader.classList.add("hidden");
        lightboxImage.classList.add("loaded");
      };
      lightboxImage.onerror = () => { lightboxLoader.classList.add("hidden"); };
      lightboxImage.src = url;
      lightboxImage.alt = currentGalleryName;
    }

    function showPreviousImage() {
      if (currentGallery.length <= 1) return;
      currentGalleryIndex = (currentGalleryIndex - 1 + currentGallery.length) % currentGallery.length;
      updateLightbox();
    }

    function showNextImage() {
      if (currentGallery.length <= 1) return;
      currentGalleryIndex = (currentGalleryIndex + 1) % currentGallery.length;
      updateLightbox();
    }

    lightboxPrev.addEventListener("click", e => { e.stopPropagation(); showPreviousImage(); });
    lightboxNext.addEventListener("click", e => { e.stopPropagation(); showNextImage(); });
    lightboxClose.addEventListener("click", e => { e.stopPropagation(); closeLightbox(); });
    lightbox.addEventListener("click", event => { if (event.target === lightbox) closeLightbox(); });

    document.addEventListener("keydown", event => {
      if (!lightbox.classList.contains("open")) return;
      if (event.key === "Escape") closeLightbox();
      if (event.key === "ArrowLeft") showPreviousImage();
      if (event.key === "ArrowRight") showNextImage();
    });

    let touchStartX = 0, touchStartY = 0;
    lightbox.addEventListener("touchstart", event => {
      if (!event.touches || !event.touches[0]) return;
      touchStartX = event.touches[0].clientX;
      touchStartY = event.touches[0].clientY;
    }, { passive: true });

    lightbox.addEventListener("touchend", event => {
      if (!event.changedTouches || !event.changedTouches[0]) return;
      if (lightboxZoomed) return;
      const dx = event.changedTouches[0].clientX - touchStartX;
      const dy = event.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0) showPreviousImage();
        else showNextImage();
      }
    }, { passive: true });

    /* =========================================================
       数据加载 & 图层初始化
    ========================================================== */
    map.on("load", async () => {

      // let spotData = null;
      // try {
      //   const r = await fetch("./data/luohu.json");
      //   if (!r.ok) throw new Error("HTTP " + r.status);
      //   spotData = await r.json();
      // } catch (e) {
      //   console.error("夜生活数据加载失败：", e);
      //   alert("夜生活数据加载失败\n请确认 ./data/luohu.json 可访问\n错误：" + e.message);
      //   return;
      // }
      // nightSpots = Object.values(spotData).flat();
      // nightSpots.forEach(spot => buildSpotSearchIndex(spot));

      const DATA_FILES = [
        "./data/luohu.json",
        "./data/futian.json",
        "./data/nanshan.json",
        "./data/baoan.json",
        "./data/guangming.json",
        "./data/longhua.json",
        "./data/longgang.json",
        "./data/pingshan.json",
        "./data/yantian.json",
        "./data/dapeng.json"
      ];
      const allSpots = [];
      for (const url of DATA_FILES) {
        try {
          const r = await fetch(url);
          if (!r.ok) throw new Error("HTTP " + r.status);
          const json = await r.json();
          allSpots.push(...Object.values(json).flat());
        } catch (e) {
          console.error(`数据加载失败：${url}`, e);
        }
      }

      if (allSpots.length === 0) {
        alert("夜生活数据加载失败，请确认 ./data/ 下 JSON 文件可访问");
        return;
      }

      nightSpots = allSpots;
      nightSpots.forEach(spot => buildSpotSearchIndex(spot));

      spotsGeoJSON = {
        type: "FeatureCollection",
        features: nightSpots.map(spot => ({
          type: "Feature",
          properties: {
            name: spot.name, type: spot.type, rating: spot.rating,
            spend: spot.spend, desc: spot.desc, address: spot.address,
            hours: spot.hours, images: JSON.stringify(getSpotImages(spot))
          },
          geometry: { type: "Point", coordinates: [Number(spot.lng), Number(spot.lat)] }
        }))
      };

      let geojson = null;
      try {
        const r = await fetch("./data/shenzhen_boundary.json");
        if (r.ok) geojson = convertBoundaryToWgs84(await r.json());
        else console.warn("行政区 HTTP", r.status);
      } catch (e) { console.warn("行政区加载失败（跳过）：", e); }

      if (geojson) {
        geojson.features.forEach(f => { f.properties.neon = "#00d9ff"; });
        map.addSource("area", { type: "geojson", data: geojson });

        map.addLayer({ id: "area-fill", type: "fill", source: "area",
          paint: { "fill-color": "#063d52", "fill-opacity": 0.42, "fill-antialias": true } });

        map.addLayer({ id: "neon-glow", type: "line", source: "area",
          layout: { "line-cap": "round", "line-join": "round" },
          paint: { "line-color": ["get", "neon"], "line-width": 18, "line-blur": 16, "line-opacity": 0.55 } });

        map.addLayer({ id: "neon-line", type: "line", source: "area",
          layout: { "line-cap": "round", "line-join": "round" },
          paint: { "line-color": ["get", "neon"], "line-width": 3, "line-opacity": 0.95 } });

        map.addLayer({ id: "neon-core", type: "line", source: "area",
          layout: { "line-cap": "round", "line-join": "round" },
          paint: { "line-color": "#ffffff", "line-width": 1.2, "line-opacity": 1 } });

        const labelGeoJSON = {
          type: "FeatureCollection",
          features: geojson.features.map(feature => {
            const name = feature.properties.name;
            const center = manualCenters[name] || feature.properties.center;
            const valid = center && Array.isArray(center) && center.length === 2
              && !(center[0] === 0 && center[1] === 0);
            if (!valid) return null;
            return { type: "Feature", properties: { name },
              geometry: { type: "Point", coordinates: center } };
          }).filter(Boolean)
        };

        if (!labelGeoJSON.features.some(f => f.properties.name.includes("大鹏"))) {
          labelGeoJSON.features.push({
            type: "Feature", properties: { name: "大鹏新区" },
            geometry: { type: "Point", coordinates: [114.45, 22.60] }
          });
        }

        map.addSource("area-labels", { type: "geojson", data: labelGeoJSON });
        map.addLayer({ id: "area-labels", type: "symbol", source: "area-labels",
          layout: {
            "text-field": ["get", "name"],
            "text-size": ["interpolate", ["linear"], ["zoom"], 8, 12, 12, 16],
            "text-font": ["Noto Sans Regular"],
            "text-allow-overlap": true, "text-ignore-placement": true
          },
          paint: { "text-color": "#ffffff", "text-halo-color": "#001a2e",
            "text-halo-width": 2.5, "text-halo-blur": 0.5 } });
      }

      map.addSource("night-spots", { type: "geojson", data: spotsGeoJSON });

      const typeColorMatch = [
        "match", ["get", "type"],
        "bar", SPOT_COLORS.bar,
        "beer bar", SPOT_COLORS["beer bar"],
        "whiskey bar", SPOT_COLORS["whiskey bar"],
        "lounge bar", SPOT_COLORS["lounge bar"],
        "bar & restaurant", SPOT_COLORS["bar & restaurant"],
        "club", SPOT_COLORS.club,
        "livehouse", SPOT_COLORS.livehouse,
        "#ffffff"
      ];

      map.addLayer({ id: "night-glow", type: "circle", source: "night-spots",
        paint: {
          "circle-radius": ["interpolate", ["linear"], ["zoom"],
            8, ["step", ["get", "rating"], 5, 3, 7, 4, 9, 4.5, 12],
            12, ["step", ["get", "rating"], 9, 3, 12, 4, 15, 4.5, 19],
            16, ["step", ["get", "rating"], 14, 3, 18, 4, 22, 4.5, 28]],
          "circle-color": typeColorMatch,
          "circle-opacity": 0.24, "circle-blur": 1 } });

      map.addLayer({ id: "night-halo", type: "circle", source: "night-spots",
        paint: {
          "circle-radius": ["interpolate", ["linear"], ["zoom"],
            8, ["step", ["get", "rating"], 2.5, 3, 3.5, 4, 4.5, 4.5, 6],
            12, ["step", ["get", "rating"], 4, 3, 5, 4, 6, 4.5, 8],
            16, ["step", ["get", "rating"], 5, 3, 6, 4, 7, 4.5, 9]],
          "circle-color": typeColorMatch,
          "circle-opacity": 0.78, "circle-blur": 0.35 } });

      map.addLayer({ id: "night-core", type: "circle", source: "night-spots",
        paint: {
          "circle-radius": ["interpolate", ["linear"], ["zoom"],
            8, ["step", ["get", "rating"], 1.2, 3, 1.6, 4, 2.1, 4.5, 2.8],
            12, ["step", ["get", "rating"], 1.8, 3, 2.3, 4, 2.8, 4.5, 3.5],
            16, ["step", ["get", "rating"], 2.5, 3, 3, 4, 3.5, 4.5, 4.5]],
          "circle-color": typeColorMatch,
          "circle-opacity": 1,
          "circle-stroke-color": "#ffffff", "circle-stroke-width": 0.8 } });

      let t = 0;
      function pulse() {
        t = (t + 0.008) % 1;
        const intensity = 0.5 + 0.5 * Math.sin(t * Math.PI * 2);
        if (map.getLayer("neon-glow"))
          map.setPaintProperty("neon-glow", "line-opacity", 0.35 + intensity * 0.35);
        if (map.getLayer("night-glow"))
          map.setPaintProperty("night-glow", "circle-opacity", 0.2 + intensity * 0.25);
        if (map.getLayer("night-halo"))
          map.setPaintProperty("night-halo", "circle-opacity", 0.58 + intensity * 0.25);
        requestAnimationFrame(pulse);
      }
      pulse();

      buildTypeList();
      renderSpotList();

      map.on("click", "night-halo", handleMapSpotClick);
      // map.on("mouseenter", "night-halo", () => { map.getCanvas().style.cursor = "pointer"; });
      // map.on("mouseleave", "night-halo", () => { map.getCanvas().style.cursor = ""; });

      /* ---------- 悬停提示（仅桌面端） ---------- */
      const canHover =
        window.matchMedia("(hover: hover) and (pointer: fine)").matches;

      const tooltipEl = document.getElementById("mapTooltip");

      function showTooltip(feature, point) {
        const p = feature.properties || {};
        const color = SPOT_COLORS[p.type] || "#ffffff";
        const label = SPOT_LABELS[p.type] || p.type || "";
        const rating = Number.isFinite(Number(p.rating))
          ? Number(p.rating).toFixed(1)
          : "--";

        tooltipEl.innerHTML = `
          <div class="tt-name">${escapeHtml(p.name || "")}</div>
          <div class="tt-meta" style="color:${color}">
            ${escapeHtml(label)} · ★ ${rating}
          </div>
        `;
        tooltipEl.style.left = point.x + "px";
        tooltipEl.style.top = point.y + "px";
        tooltipEl.classList.add("visible");
      }

      function hideTooltip() {
        tooltipEl.classList.remove("visible");
      }

      if (canHover) {
        map.on("mousemove", event => {
          const feats = map.queryRenderedFeatures(event.point, {
            layers: ["night-halo", "night-core"]
          });
          if (feats.length) {
            showTooltip(feats[0], event.point);
            map.getCanvas().style.cursor = "pointer";
          } else {
            hideTooltip();
            map.getCanvas().style.cursor = "";
          }
        });

        // 地图平移/缩放时隐藏，避免浮层错位
        map.on("movestart", hideTooltip);
        map.on("zoomstart", hideTooltip);
        map.on("dragstart", hideTooltip);
      }
    });

    /* =========================================================
       移动端：面板展开 / 收起
    ========================================================== */
    (function setupMobilePanel() {
      const toggle = document.getElementById("mobileToggle");
      const panel = document.getElementById("sidePanel");
      const closeBtn = document.getElementById("panelCloseBtn");

      if (!toggle || !panel) return;

      function openPanel() {
        panel.classList.add("mobile-open");
        toggle.classList.add("open");
        toggle.setAttribute("aria-expanded", "true");
      }

      function closePanel() {
        panel.classList.remove("mobile-open");
        toggle.classList.remove("open");
        toggle.setAttribute("aria-expanded", "false");
        setSearchOpen(false);
        closeCurrentPopup();
      }

      toggle.addEventListener("click", () => {
        if (panel.classList.contains("mobile-open")) closePanel();
        else openPanel();
      });

      if (closeBtn) closeBtn.addEventListener("click", closePanel);

      let lastMobile = window.matchMedia("(max-width: 700px)").matches;
      window.addEventListener("resize", () => {
        const nowMobile = window.matchMedia("(max-width: 700px)").matches;
        if (nowMobile !== lastMobile) {
          lastMobile = nowMobile;
          closePanel();
        }
      });
    })();
  </script>
